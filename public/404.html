<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404</title>
  <style>
    :root {
      --dvd-color: #36f9f6;
      --dvd-glow: rgba(54, 249, 246, 0.58);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05050b;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      font-family: "Courier New", Courier, monospace;
    }

    .dvd-stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(54, 249, 246, 0.12), transparent 26%),
        radial-gradient(circle at 80% 70%, rgba(255, 42, 109, 0.10), transparent 26%),
        #05050b;
    }

    .dvd-logo {
      position: absolute;
      top: 0;
      left: 0;
      display: grid;
      place-items: center;
      width: clamp(120px, 17vw, 230px);
      aspect-ratio: 1.62 / 1;
      border: 3px solid var(--dvd-color);
      border-radius: 22px;
      color: var(--dvd-color);
      background: rgba(0, 0, 0, 0.28);
      box-shadow:
        0 0 22px var(--dvd-glow),
        0 0 58px var(--dvd-glow),
        inset 0 0 24px rgba(255, 255, 255, 0.08);
      font-size: clamp(42px, 6vw, 82px);
      font-weight: 900;
      letter-spacing: -0.08em;
      line-height: 1;
      text-shadow: 0 0 18px var(--dvd-glow);
      user-select: none;
      will-change: transform;
      transform: translate3d(0, 0, 0);
    }

    .dvd-logo::after {
      content: "return to home";
      position: absolute;
      right: 14px;
      bottom: 10px;
      font-size: clamp(10px, 1.4vw, 16px);
      letter-spacing: 0.2em;
    }

    .dvd-logo.hit {
      animation: hit 0.28s ease-out;
    }

    @keyframes hit {
      0% { scale: 1; filter: brightness(1); }
      45% { scale: 1.08; filter: brightness(1.45); }
      100% { scale: 1; filter: brightness(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .dvd-logo {
        animation: none !important;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) !important;
      }
    }
  </style>
</head>
<body>
  <main class="dvd-stage" aria-label="404 page">
    <div class="dvd-logo" id="dvd-logo" aria-hidden="true">404</div>
  </main>

  <script>
    (() => {
      const logo = document.getElementById('dvd-logo');
      const root = document.documentElement;

      const colors = [
        ['#36f9f6', 'rgba(54, 249, 246, 0.58)'],
        ['#ff2a6d', 'rgba(255, 42, 109, 0.58)'],
        ['#f8f32b', 'rgba(248, 243, 43, 0.55)'],
        ['#7cff6b', 'rgba(124, 255, 107, 0.55)'],
        ['#b967ff', 'rgba(185, 103, 255, 0.58)'],
        ['#ff9f1c', 'rgba(255, 159, 28, 0.55)']
      ];

      const route = ['tl', 'br', 'tr', 'bl'];
      let routeIndex = 0;
      let colorIndex = 0;
      let x = 0;
      let y = 0;
      let maxX = 0;
      let maxY = 0;
      let target = 'br';
      let lastTime = performance.now();
      let rafId;

      function measure() {
        maxX = Math.max(0, window.innerWidth - logo.offsetWidth);
        maxY = Math.max(0, window.innerHeight - logo.offsetHeight);
      }

      function cornerPosition(corner) {
        return {
          x: corner.includes('r') ? maxX : 0,
          y: corner.includes('b') ? maxY : 0
        };
      }

      function setColor() {
        colorIndex = (colorIndex + 1) % colors.length;
        root.style.setProperty('--dvd-color', colors[colorIndex][0]);
        root.style.setProperty('--dvd-glow', colors[colorIndex][1]);
      }

      function draw() {
        logo.style.transform = `translate3d(${x}px, ${y}px, 0)`;
      }

      function pulse() {
        logo.classList.remove('hit');
        void logo.offsetWidth;
        logo.classList.add('hit');
      }

      function nextTarget() {
        routeIndex = (routeIndex + 1) % route.length;
        target = route[routeIndex];
      }

      function tick(now) {
        const dt = Math.min(0.032, Math.max(0.001, (now - lastTime) / 1000));
        lastTime = now;

        const destination = cornerPosition(target);
        const dx = destination.x - x;
        const dy = destination.y - y;
        const distance = Math.hypot(dx, dy);
        const speed = Math.min(700, Math.max(240, Math.hypot(maxX, maxY) * 0.24));
        const step = speed * dt;

        if (distance <= step || distance < 0.75) {
          x = destination.x;
          y = destination.y;
          draw();
          setColor();
          pulse();
          nextTarget();
        } else {
          x += (dx / distance) * step;
          y += (dy / distance) * step;
          draw();
        }

        rafId = requestAnimationFrame(tick);
      }

      function start() {
        cancelAnimationFrame(rafId);
        measure();
        x = 0;
        y = 0;
        routeIndex = 0;
        target = 'br';
        draw();
        lastTime = performance.now();

        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          rafId = requestAnimationFrame(tick);
        }
      }

      window.addEventListener('resize', () => {
        measure();
        x = Math.min(x, maxX);
        y = Math.min(y, maxY);
        draw();
      });

      start();
    })();
  </script>
</body>
</html>
